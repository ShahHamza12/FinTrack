<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget · Fintrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,560&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <button class="menu-toggle" id="menuToggle">Menu</button>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="dashboard.html"><span class="brand-mark">F</span> Fintrack</a>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="transactions.html">Transactions</a>
        <a href="budget.html">Budget</a>
        <a href="goals.html">Goals</a>
        <a href="analytics.html">Analytics</a>
        <a href="reports.html">Reports</a>
      </nav>
      <div class="sidebar-foot">
        <strong id="userName">Account</strong>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" style="margin-top:8px;color:#fff;border-color:rgba(255,255,255,.2)">Log out</button>
      </div>
    </aside>
    <main class="app-main">
      <div class="page-head">
        <div>
          <p class="muted">Limits</p>
          <h1>Monthly budget</h1>
        </div>
        <input type="month" id="budgetMonth" />
      </div>
      <section class="grid-2">
        <div class="panel">
          <h2>Category caps</h2>
          <div id="budgetList"></div>
        </div>
        <form class="panel" id="budgetForm">
          <h2>Set or update a budget</h2>
          <div class="form-group">
            <label for="budgetCategory">Category</label>
            <select id="budgetCategory"></select>
          </div>
          <div class="form-group">
            <label for="budgetLimit">Limit (INR)</label>
            <input id="budgetLimit" type="number" min="1" required />
          </div>
          <button class="btn btn-primary" type="submit">Save budget</button>
        </form>
      </section>
    </main>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/budget.js"></script>
</body>
</html>
