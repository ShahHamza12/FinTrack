<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register · Fintrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,560&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="auth-page">
    <aside class="auth-aside">
      <a class="brand" href="index.html"><span class="brand-mark">F</span> Fintrack</a>
      <h2>Start tracking today. Connect a backend whenever you are ready.</h2>
      <p>Your data lives in this browser until you set FINTRACK_API_BASE.</p>
    </aside>
    <div class="auth-panel">
      <form class="auth-card" id="registerForm">
        <h1>Create account</h1>
        <p class="muted">Already registered? <a href="login.html">Log in</a></p>
        <div class="alert alert-error" id="authAlert"></div>
        <div class="form-group">
          <label for="name">Full name</label>
          <input id="name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" required />
          </div>
          <div class="form-group">
            <label for="confirm">Confirm</label>
            <input id="confirm" type="password" required />
          </div>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
      </form>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
