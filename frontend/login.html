<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · Fintrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,560&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <div class="auth-page">
    <aside class="auth-aside">
      <a class="brand" href="index.html"><span class="brand-mark">F</span> Fintrack</a>
      <h2>Welcome back to your money, clearly laid out.</h2>
      <p>Demo account:  aarav@fintrack.test  /  demo1234</p>
    </aside>
    <div class="auth-panel">
      <form class="auth-card" id="loginForm">
        <h1>Log in</h1>
        <p class="muted">New here? <a href="register.html">Create an account</a></p>
        <div class="alert alert-error" id="authAlert"></div>
        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" type="email" required placeholder="you@email.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" required />
        </div>
        <button class="btn btn-primary btn-block" type="submit">Continue</button>
      </form>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
