<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transactions · Fintrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,560&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <button class="menu-toggle" id="menuToggle">Menu</button>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="dashboard.html"><span class="brand-mark">F</span> Fintrack</a>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="transactions.html">Transactions</a>
        <a href="budget.html">Budget</a>
        <a href="goals.html">Goals</a>
        <a href="analytics.html">Analytics</a>
        <a href="reports.html">Reports</a>
      </nav>
      <div class="sidebar-foot">
        <strong id="userName">Account</strong>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" style="margin-top:8px;color:#fff;border-color:rgba(255,255,255,.2)">Log out</button>
      </div>
    </aside>
    <main class="app-main">
      <div class="page-head">
        <div>
          <p class="muted">Cash flow</p>
          <h1>Transactions</h1>
        </div>
        <button class="btn btn-primary" id="addTx">Add transaction</button>
      </div>
      <div class="toolbar">
        <input class="search-input" id="search" placeholder="Search notes or category" style="max-width:240px" />
        <select id="filterType">
          <option value="">All types</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
        <select id="filterCategory" data-categories="filter"></select>
        <input type="month" id="filterMonth" />
      </div>
      <div class="panel">
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr><th>Date</th><th>Note</th><th>Category</th><th>Type</th><th>Amount</th><th></th></tr>
            </thead>
            <tbody id="txTable"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <div class="modal-backdrop" id="txModal">
    <form class="modal" id="txForm">
      <h2 id="modalTitle">Add transaction</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="txType">Type</label>
          <select id="txType"><option value="expense">Expense</option><option value="income">Income</option></select>
        </div>
        <div class="form-group">
          <label for="txAmount">Amount (INR)</label>
          <input id="txAmount" type="number" min="1" required />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="txCategory">Category</label>
          <select id="txCategory" data-categories="form"></select>
        </div>
        <div class="form-group">
          <label for="txDate">Date</label>
          <input id="txDate" type="date" required />
        </div>
      </div>
      <div class="form-group">
        <label for="txNote">Note</label>
        <input id="txNote" placeholder="e.g. Weekly groceries" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="closeModal">Cancel</button>
        <button class="btn btn-primary" type="submit">Save</button>
      </div>
    </form>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/transactions.js"></script>
</body>
</html>
